diagrams:
  - id: flow
    title: "KV-cache compression pipeline on MI300X"
    nodes:
      - {id: kv, label: "K / V head vector", sub: "128 dims, fp16 (256 B)", col: 0, row: 0, kind: io}
      - {id: rot, label: "rotation", sub: "WHT / planar / iso / rotor", col: 1, row: 0, kind: accent}
      - {id: q, label: "3-bit quantise", sub: "Lloyd-Max codebook", col: 2, row: 0}
      - {id: blk, label: "52-byte block", sub: "4.92x smaller", col: 3, row: 0, kind: store}
      - {id: att, label: "fused dequant + attention", sub: "Triton, one pass", col: 3, row: 1}
      - {id: out, label: "attention output", sub: "split-K reduce", col: 2, row: 1, kind: io}
    edges:
      - {from: kv, to: rot}
      - {from: rot, to: q}
      - {from: q, to: blk}
      - {from: blk, to: att, label: "decode"}
      - {from: att, to: out}

sections:
  - title: Results
    emoji: "📊"
    id: results
    body: "MI300X VF (gfx942), Mistral-7B-v0.1 shapes. All numbers are read from `results/*.json` by `tools/readme_data.py`."
    charts: [compress_bw, prefill]
    tables: [methods_tbl]
    after: |
      The four 3-bit methods share an identical 52-byte block layout, so compression ({{ n.ratio }}) and reconstruction quality (cosine about {{ n.cos3 }}) match; what differs is speed.
      **PlanarQuant** is the recommended method: fewest FMAs ({{ n.fma_p }} per vector against {{ n.fma_t }} for TurboQuant) and the fastest prefill compression ({{ n.pre_x }} faster than TurboQuant).
      IsoQuant has the highest pack bandwidth ({{ n.iso_c }}); RotorQuant is not competitive with Iso or Planar on this hardware.
  - title: Attention and serving
    emoji: "⚡"
    id: attention
    body: "What the compressed cache buys at decode time."
    charts: [triton, vllm]
    after: |
      The fused Triton TQ3 kernel is {{ n.tri1 }} of fp16 SDPA at 1K tokens and {{ n.tri32 }} at 32K (up to {{ n.tri_best }}). In a GQA fused-decode sweep it is {{ n.gqa_min }} to {{ n.gqa_max }} faster than decompress then SDPA.
      In vLLM serving on Mistral-7B, output throughput is flat across fp16, TurboQuant decompress and TurboQuant fused ({{ n.v_min }} to {{ n.v_max }} tok/s): the KV format does not unlock end-to-end decode when weights, the MLP and the framework dominate.
      Details and the closure analysis: [docs/repo_decode_bottleneck_closure.md](docs/repo_decode_bottleneck_closure.md), [report/final_report_v2.md](report/final_report_v2.md).
  - title: How it works
    emoji: "🧩"
    id: how-it-works
    body: |
      Each K or V head vector (128 dims) is rotated, quantised to 3 bits and packed into a 52-byte block, **{{ n.ratio }}** smaller than fp16. The four methods differ only in the rotation:
      TurboQuant's Walsh-Hadamard transform is the most expensive; PlanarQuant (2D Givens), IsoQuant (quaternion) and RotorQuant (Clifford rotor) are block rotations that are far cheaper.
      Kernels: Triton/ROCm in `kernels/`, standalone HIP in `kernels/hip/` (9-test validation suite), MFMA-backed rotation, and a fused dequant-attention Triton kernel.
    diagrams: [flow]
    images:
      - {src: report/figures_v2/fig23_kv_cache_compression_comparison.png, alt: "KV cache compression comparison on MI300X (report figure 23)", width: "85%"}
  - title: Quick start
    emoji: "🚀"
    id: quick-start
    body: |
      Use the locked benchmark interpreter for GPU work (`docs/benchmark_mi300_locked_env.md`).

      ```bash
      python3 benchmarks/bench_compress_decompress.py --n-vectors 4096 --n-iters 50   # ~30 s
      python3 benchmarks/bench_prefill.py --model mistralai/Mistral-7B-v0.1
      python3 benchmarks/bench_batch_decode_v2.py --model mistralai/Mistral-7B-v0.1
      python3 report/generate_figures_v2.py                                            # regenerate report figures
      bash run_all_benchmarks.sh mistralai/Mistral-7B-v0.1                             # full suite, 60-90 min
      python3 tools/readme_data.py && python3 ~/video-readme-maker/vrm.py all README.spec.yml   # this README and video
      ```
      HIP kernels: `cd kernels/hip && bash build_mi300x.sh` (build and run inside the ROCm 7.2 Primus container, see `docker_run_amd_mi300x.sh`).
      The complete previous README (benchmark catalogue, SWA mode, ABI notes, reading order) is kept in [docs/ORIGINAL_README.md](docs/ORIGINAL_README.md).

caveats:
  - "**One GPU model, one model family.** Everything is MI300X (gfx942) with Mistral-7B-v0.1 shapes."
  - "**NIAH is synthetic** ({{ n.niah }} pass on every 3-bit method) and perplexity runs use small windows."
  - "**Serving is one configuration** (1024 in / 256 out, 32 prompts). Flat end-to-end throughput does not mean KV compression is useless at larger batch or longer context."
  - "**Fused-kernel gains depend on context length**: at 4K tokens and below the fused TQ3 kernel is slower than fp16 SDPA."
  - "**HIP kernels cannot be loaded via ctypes in the PyTorch process** (ROCm code-object ABI mismatch); standalone binaries are used instead."

