intro: |
  <a id="video"></a>
  A four-way benchmark of **TurboQuant**, **IsoQuant**, **PlanarQuant** and **RotorQuant** KV-cache compression on an **AMD Instinct MI300X** (gfx942, 192 GB HBM3),
  with Triton/ROCm and HIP kernels, Mistral-7B-v0.1 shapes, compress/decompress bandwidth, prefill overhead, fused-attention decode and KV reconstruction quality.

  All four 3-bit methods share the same 52-byte block layout, so they compress identically (**{{ n.ratio }}** versus fp16) and reconstruct with the same cosine similarity (about {{ n.cos3 }}).
  They differ in **how fast they run**: the rotation is the cost. PlanarQuant uses {{ n.fma_p }} FMAs per vector, TurboQuant {{ n.fma_t }}.

  > **Honest bottom line.** The compression itself is cheap and accurate, and a fused Triton TQ3 attention kernel beats fp16 SDPA at long context ({{ n.tri32 }} at 32K, B=1),
  > but in vLLM serving of Mistral-7B **end-to-end output tokens per second do not change** ({{ n.v_min }} to {{ n.v_max }} tok/s for fp16, TQ decompress and TQ fused), because weights and MLP dominate the decode step.

video:
  url: ""
  caption: "Explainer video (voice-over and subtitles): what was compared, what is faster, and where the gain stops"
  mp4: video/amd_experiments_explainer.mp4
  gif: video/preview.gif
  srt: video/amd_experiments_explainer.srt
  poster: video/poster.png
  out_dir: video/.render
  fps: 24
  max_mb: 22
  render_crf: 18
  poster_at: 40
  music: true
  voice: {engine: openai, voice: alloy, model: gpt-4o-mini-tts, tempo: 1.2}
  scenes:
    - type: title
      title: "KV-cache compression on MI300X"
      subtitle: "TurboQuant, IsoQuant, PlanarQuant, RotorQuant"
      chips: [AMD MI300X, Triton, ROCm, 3-bit KV]
      say: "KV cache compression on the AMD Instinct MI300X. A four way benchmark of TurboQuant, IsoQuant, PlanarQuant and RotorQuant. This is a short tour of what we measured, and where the gains stop."
    - type: problem
      heading: "The problem"
      bullets:
        - "Long-context decode is limited by KV-cache memory"
        - "3-bit compression shrinks the cache {{ n.ratio.text }}"
        - "But rotations cost compute on every vector"
        - "Which method is cheap enough to use on MI300X?"
      say: "Long context decoding is limited by the size of the key value cache. Three bit compression shrinks it by {{ n.ratio.numtext }} times. But every method rotates each vector first, and that costs compute. Which one is cheap enough on the MI300X?"
    - type: architecture
      diagram: flow
      heading: "The pipeline"
      say: "A key or value head vector is rotated, quantised to three bits, and stored as a fifty two byte block. At decode time a fused kernel unpacks the block and runs attention in one pass."
    - type: chart
      chart: compress_bw
      say: "Compression bandwidth, same data, same layout. IsoQuant packs at {{ n.iso_c.numtext }} gigabytes per second. TurboQuant manages only {{ n.turbo_c.numtext }}, because its rotation needs sixteen thousand multiply adds per vector."
    - type: chart
      chart: prefill
      say: "That shows up in prefill compression throughput at thirty two thousand tokens. PlanarQuant reaches {{ n.planar_p.numtext }} thousand tokens per second against {{ n.turbo_p.numtext }} thousand for TurboQuant, which is {{ n.pre_x.numtext }} times faster."
    - type: results
      heading: "Same bytes, same quality"
      items:
        - {label: "compression vs fp16 (all four)", number: ratio}
        - {label: "cosine similarity, 3-bit", number: cos3}
        - {label: "cosine similarity, 4-bit", number: cos4}
      say: "All four methods store {{ n.ratio.numtext }} times fewer bytes and reconstruct with cosine similarity around {{ n.cos3.numtext }} at three bits and {{ n.cos4.numtext }} at four bits. Needle in a haystack retrieval passes {{ n.niah.numtext }} percent on the synthetic test."
    - type: chart
      chart: triton
      say: "A fused Triton attention kernel that reads the compressed cache directly is slower than fp16 at short contexts, only {{ n.tri1.numtext }} of fp16 speed at one K, but faster at long contexts: {{ n.tri32.numtext }} at thirty two K, and up to {{ n.tri_best.numtext }}. With grouped query attention, fused decode is {{ n.gqa_min.numtext }} to {{ n.gqa_max.numtext }} times faster than decompress then attend."
    - type: chart
      chart: vllm
      say: "But in an end to end vLLM run of Mistral seven B, output throughput is flat, between {{ n.v_min.numtext }} and {{ n.v_max.numtext }} tokens per second, whether the cache is fp16, decompressed, or fused. Weights, the MLP and the framework dominate the step, so the KV format does not unlock decode speed in that setting."
    - type: caveats
      heading: "Honest caveats"
      bullets:
        - "One GPU model, one LLM family (Mistral-7B shapes)"
        - "Needle test is synthetic; perplexity windows are small"
        - "Serving result is one batch configuration"
        - "Fused-kernel win depends on context length"
      say: "Caveats. One GPU model, and Mistral seven B shapes. The needle test is synthetic and perplexity uses small windows. The serving result is a single batch configuration. And the fused kernel only wins at longer contexts."
    - type: end
      title: "amd-experiments"
      subtitle: "Kernels, results and the full report are in the repo"
      say: "Kernels, results, and the full report are in the repo."

